# Overlay that switches the development stack from SQLite to PostgreSQL.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bankcashops}"
      POSTGRES_USER: "${POSTGRES_USER:-bankcashops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bankcashops}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankcashops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-bankcashops}:${POSTGRES_PASSWORD:-bankcashops}@db:5432/${POSTGRES_DB:-bankcashops}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
