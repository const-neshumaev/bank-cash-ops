name: core
title: Ядро
version: 0.6.0
description: Пользователи, аутентификация, роли и права, оргструктура (отделения, кассы), кассовые смены, установка курсов валют (единицы, прямые пары конверсии) и настройки банка с базовыми величинами.

dependencies:
  - name: references
    version: "0.3.0"
    access: inprocess

provides:
  contracts: modules.core.contracts
  api_base: /api/
  frontend_routes: true

config:
  - name: DJANGO_SUPERUSER_EMAIL
    description: Email начального администратора.
  - name: DJANGO_SUPERUSER_PASSWORD
    description: Пароль начального администратора.
