name: operations
title: Кассовые операции
version: 0.2.0
description: Ядро операционного учёта кассовых операций (движок, регистры, журнал).

dependencies:
  - name: core
    version: ">=0.1,<1"
    access: inprocess        # inprocess | http

provides:
  contracts: modules.operations.contracts
  api_base: /api/operations/
  frontend_routes: true

config:
  - name: BCO_OPERATIONS_BASE_CURRENCY
    description: Базовая валюта банка для порогов и отчётности.
    default: "BYN"
  - name: BCO_OPERATIONS_CLIENT_ID_THRESHOLD
    description: Порог суммы в базовой валюте, выше которого требуется документ клиента.
    default: "0"
  - name: BCO_OPERATIONS_REQUIRE_CLIENT
    description: Требовать данные клиента по умолчанию для операций без явной настройки.
    default: "false"
