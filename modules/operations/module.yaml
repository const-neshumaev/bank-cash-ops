name: operations
title: Кассовые операции
version: 0.4.0
description: Ядро операционного учёта кассовых операций (движок, регистры, журнал, формы операций, контроль данных клиента, курсы обмена и печатные документы).

dependencies:
  - name: core
    version: ">=0.1,<1"
    access: inprocess        # inprocess | http
  - name: references
    version: "0.3.0"
    access: inprocess
  - name: printing
    version: ">=0.1,<1"
    access: inprocess

provides:
  contracts: modules.operations.contracts
  api_base: /api/operations/
  frontend_routes: true
