name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        # Run from the repository root so ruff resolves the project root to the
        # VCS root and treats both `config` and `modules` as first-party.
        run: ruff check --config backend/pyproject.toml backend modules

      - name: Check for missing migrations
        # Fail when models changed without a matching migration. The throwaway
        # SQLite file keeps the check off the workspace and its output quiet.
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
          SQLITE_PATH: ${{ runner.temp }}/ci.sqlite3
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        # Replicate the container layout, where the Django host project and the
        # `modules` package sit side by side: the host project provides settings
        # (PYTHONPATH) and the modules provide the tests.
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: pytest -c backend/pyproject.toml modules

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Assemble module frontends
        # Module frontends live in modules/ and are exposed under the frontend
        # root as ./modules (see modules/<name>/frontend).
        run: |
          mkdir -p frontend/modules
          cp -r modules/. frontend/modules/

      - name: Build
        working-directory: frontend
        run: npm run build
