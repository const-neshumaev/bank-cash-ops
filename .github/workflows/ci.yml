name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest

    # PostgreSQL is the project's only database (docs/adr/0002-postgresql-in-development.md),
    # so both the migration check and the test suite run against it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankcashops
          POSTGRES_USER: bankcashops
          POSTGRES_PASSWORD: bankcashops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankcashops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Replicate the container layout, where the Django host project and the
      # `modules` package sit side by side: the host project provides settings
      # (PYTHONPATH) and the modules provide the tests.
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      DATABASE_URL: postgres://bankcashops:bankcashops@localhost:5432/bankcashops

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install gettext (translation tooling)
        # ``compilemessages``/``makemessages`` need msgfmt/xgettext.
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Compile translation catalogs
        # Fails on malformed .po files and verifies the catalogs build.
        run: python backend/manage.py compilemessages

      - name: Lint (ruff)
        # Run from the repository root so ruff resolves the project root to the
        # VCS root and treats both `config` and `modules` as first-party.
        run: ruff check --config backend/pyproject.toml backend modules

      - name: Check for missing migrations
        # Fail when models changed without a matching migration.
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: pytest -c backend/pyproject.toml modules

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Assemble module frontends
        # Module frontends live in modules/ and are exposed under the frontend
        # root as ./modules (see modules/<name>/frontend).
        run: |
          mkdir -p frontend/modules
          cp -r modules/. frontend/modules/

      - name: Build
        working-directory: frontend
        run: npm run build
